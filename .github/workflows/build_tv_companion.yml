name: Build TV Companion APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Build TV APK
        working-directory: tv_companion
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pult-TV-${{ github.run_number }}
          path: tv_companion/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Attach TV APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp tv_companion/app/build/outputs/apk/release/app-release.apk Pult-TV.apk
          gh release create "pult-tv-test-${{ github.run_number }}" Pult-TV.apk \
            --title "Pult TV · Test #${{ github.run_number }}" \
            --notes 'Testing build. TV companion only. Requires manually enabling Accessibility and optionally selecting its keyboard.' \
            --target "${{ github.sha }}" \
            --prerelease
