name: Build TV Companion APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Build TV APK
        working-directory: tv_companion
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      # Upload directly to GitHub Releases. Actions artifact storage is not used.
      - name: Publish TV APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_apk="tv_companion/app/build/outputs/apk/release/app-release.apk"
          test -s "$source_apk"
          cp "$source_apk" Pult-TV.apk
          gh release create "pult-tv-test-${{ github.run_number }}-a${{ github.run_attempt }}" Pult-TV.apk \
            --title "Pult TV · Test #${{ github.run_number }} (attempt ${{ github.run_attempt }})" \
            --notes 'Testing build. TV companion only. Requires manually enabling Accessibility and optionally selecting its keyboard.' \
            --target "${{ github.sha }}" \
            --prerelease
