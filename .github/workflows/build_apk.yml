name: Build APK

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release -v 2>&1 | tee build_apk.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo ""
            echo "========== IMPORTANT ERROR LINES =========="
            grep -nEi "FAILURE:|What went wrong|Execution failed|error:|Exception|Manifest merger|AAPT|Could not|failed" build_apk.log | tail -n 120 || true
            echo ""
            echo "========== LAST 250 LOG LINES =========="
            tail -n 250 build_apk.log || true
            exit "$status"
          fi

      # Upload directly to GitHub Releases. Actions artifact storage is not used.
      - name: Publish phone APK to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$source_apk"
          cp "$source_apk" Pult-Phone.apk
          gh release create "pult-phone-test-${{ github.run_number }}-a${{ github.run_attempt }}" Pult-Phone.apk \
            --title "Pult Phone · Test #${{ github.run_number }} (attempt ${{ github.run_attempt }})" \
            --notes 'Android phone remote. Use Pult-TV on the X96 for extended features.' \
            --target "${{ github.sha }}" --prerelease
